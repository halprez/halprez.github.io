<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alejandro Perez Profile</title>
    <link rel="stylesheet" href="https://unpkg.com/@sakun/system.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="background-elements">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>
    <div class="top-bar">
        <div class="lang-switcher">
            <button class="lang-button active" data-lang="en">EN</button>
            <button class="lang-button" data-lang="es">ES</button>
        </div>
        <div class="theme-switcher">
            <button class="theme-button" data-theme="light" title="Modern light">Modern</button>
            <button class="theme-button" data-theme="dark" title="Cyberpunk">Cyber</button>
            <button class="theme-button" data-theme="retro" title="Windows 95">Win95</button>
            <button class="theme-button" data-theme="system" title="Classic Mac">Classic</button>
        </div>
    </div>
    <nav class="floating-menu">
        <ul class="menu-items">
            <li><a href="#personal" class="menu-link" data-section="personal">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="menu-text" data-i18n="ui.about">About</span>
            </a></li>
            <li><a href="#experience" class="menu-link" data-section="experience">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span class="menu-text" data-i18n="ui.experience">Experience</span>
            </a></li>
            <li><a href="#education" class="menu-link" data-section="education">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
                <span class="menu-text" data-i18n="ui.education">Education</span>
            </a></li>
            <li><a href="#projects" class="menu-link" data-section="projects">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span class="menu-text" data-i18n="ui.sideProjects">Side projects</span>
            </a></li>
            <li><a href="#games" class="menu-link" data-section="games">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <circle cx="9" cy="12" r="2"></circle>
                    <path d="M15 10h2M16 9v2"></path>
                </svg>
                <span class="menu-text" data-i18n="ui.games">Games</span>
            </a></li>
        </ul>
    </nav>
    <div class="container"></div>
    <div class="scroll-indicator"></div>
    <script src="i18n.js"></script>
    <script src="arkanoid.js"></script>
    <script src="main.js"></script>
</body>
</html>
